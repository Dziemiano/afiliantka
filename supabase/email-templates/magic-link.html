<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link logowania — Afiliantka Faceless</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:system-ui,-apple-system,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;">
          <tr>
            <td style="padding:32px 28px 8px;text-align:center;">
              <p style="margin:0;font-size:22px;font-weight:700;color:#0f766e;">
                Afiliantka <span style="color:#94a3b8;font-weight:400;">Faceless</span>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 24px;text-align:center;">
              <h1 style="margin:0 0 12px;font-size:20px;color:#0f172a;">Zaloguj się</h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#475569;">
                Kliknij poniższy przycisk, aby bezpiecznie zalogować się do platformy. Link jest ważny przez ograniczony czas.
              </p>
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;padding:14px 28px;background:#0d9488;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;font-size:15px;">
                Zaloguj się
              </a>
              <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#64748b;">
                Jeśli nie prosiłeś/aś o link logowania, zignoruj tę wiadomość.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 28px;border-top:1px solid #f1f5f9;text-align:center;">
              <p style="margin:0;font-size:12px;color:#94a3b8;">
                Afiliantka Faceless — platforma dla współpracowników
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
